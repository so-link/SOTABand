# Alembic configuration
#
# NOTE: THIS FILE MUST STAY PURE ASCII.
#   Alembic reads this ini with encoding="locale" (see alembic/util/compat.py).
#   On a Chinese Windows install that means GBK, and any UTF-8 Chinese comment
#   here raises UnicodeDecodeError before Alembic even starts.
#   PYTHONUTF8=1 does NOT help: Python's UTF-8 mode changes
#   locale.getpreferredencoding(), but locale.getencoding() still returns the
#   real locale encoding. So the only robust fix is ASCII-only content.
#   (Project docs are in Chinese; see docs/design-08-schema.md section 6.)
#
# The database URL is deliberately NOT configured here.
#   migrations/env.py injects it from config.settings.storage.database_url
#   (overridable via the DATABASE_URL environment variable).
#   Having it in two places invites "app talks to DB A, migrations modify DB B".

[alembic]
script_location = migrations
prepend_sys_path = .
# Filenames look like 0001_auth_core.py -- revision ids are passed explicitly
# (alembic revision --rev-id 0001) so migrations sort by batch order rather
# than by random hash.
file_template = %%(rev)s_%%(slug)s
# Injected by env.py; must stay empty here.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
