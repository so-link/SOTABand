[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sotaband-engine"
version = "0.1.0"
description = "多智能体驱动的多模态智能处理引擎 — Multi-Agent Intelligent Architecture"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "jmlv" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "openai>=1.50.0",
    "sse-starlette>=2.0.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "requests>=2.31.0",
    # 部分 Linux 发行版自带 libsqlite3 过旧（缺 sqlite3_deserialize 符号），用自带新库的发行版兜底
    "pysqlite3-binary>=0.5.3; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",          # FastAPI TestClient 依赖（进程内 SSE / 生成链路用例）
    "ruff",
    "mypy",
    "pre-commit",
]
# 浏览器端到端测试（tests/e2e）：装完后还需 ./venv/bin/playwright install chromium
e2e = [
    "playwright>=1.40",
]

[tool.setuptools.packages.find]
include = ["app*", "core*", "resources*", "storage*", "config*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# 分层 marker：unit（纯逻辑）/ api（真实 HTTP）/ e2e（真实浏览器）。
# 不加 -m 时三层都会收集，但 e2e 需要 --run-e2e 才实际执行（见 tests/e2e/conftest.py）。
markers = [
    "unit: 纯逻辑用例，不依赖网络与服务",
    "api: 调用真实后端 HTTP 接口（8201 需已启动）",
    "e2e: 真实浏览器端到端（需前端 5173、后端 8201 与登录密码）",
]
