# Nginx 配置 —— 托管前端静态资源 + 反代 /api 到后端
#
# ## 三个必须做对的地方
#
# 1. **`/api` 反代**：前端代码里所有请求都是相对路径 `/api/...`（见
#    `services/api/client.ts` 的 BASE_URL=''）。Nginx 把 `/api` 转给后端，
#    前后端就是**同源**的 —— HttpOnly Cookie 会话、无需 CORS。
#
# 2. **SSE 必须关缓冲**：`/api/chat/send` 是 Server-Sent Events 流式接口。
#    Nginx 默认会缓冲响应，导致"前端要等整段回答生成完才一次性显示"，
#    流式效果完全消失。`proxy_buffering off` + 长读超时是必须的。
#
# 3. **SPA 回退**：项目没有路由库，但邀请链接形如 `/?invite=xxx`。
#    `try_files ... /index.html` 保证任何路径都能落到应用入口。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传体积上限（前端有文件上传功能，Nginx 默认 1M 会直接 413）
    client_max_body_size 100m;

    # ── API 反代 ──────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8001;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE：关闭缓冲，否则流式输出会被攒成一次性响应
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";

        # 长任务：工具执行 / 模型训练可能很久，不设总超时上限
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── 静态资源：带 hash 的产物可以长缓存 ────────────────────────────
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA 回退 ──────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不能缓存，否则前端发版后用户一直拿到旧版本
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
